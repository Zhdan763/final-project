server:
  port: 8080

spring:
  application:
    name: event-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/event_manager
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    url: /event-manager-openapi.yaml

my-app:
  jwt:
    secret-key: "452C5159D61D1D61A28DFD2ACC891F798DDE69D16FA3F65FDE829C40BBF9D081"
    expiration-time: 86400000
